services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - bot-data:/var/lib/ollama-bot
      - ./logs:/app/logs
    depends_on:
      ollama:
        condition: service_started
        required: false

  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    # GPU利用時は以下のコメントアウトを解除
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  bot-data:
  ollama:
